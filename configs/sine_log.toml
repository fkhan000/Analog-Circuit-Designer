# Non-traditional target: gain is a sine wave on a Bode plot (see targets/sine_log.toml).
# All component types are allowed; LC resonators are the natural way to make the peaks/notches.
name = "sine-log"
target = "../targets/sine_log.toml"
workers = 0

# Settings from the search comparison in DESIGN.md: sizing gave the best and most consistent
# results (mean 1.9 dB RMS over 3 seeds in 120 s, vs. 4.6 dB without it).
[ga]
population_size = 100
generations = 1000
elite_count = 4
tournament_size = 4
seed = 1
stall_generations = 150
time_limit_s = 120
crossover_rate = 0.0   # 0.3 helps when combined with speciation = true (see DESIGN.md)

[sizing]
enabled = true
budget = 40            # simulations per new topology

[crossover]
max_region_size = 4

[mutation]
max_components = 10

[testbench]
points_per_decade = 50   # dense enough that sharp resonances can't hide between points
