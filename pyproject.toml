[project]
name = "acd"
version = "0.1.0"
description = "Genetic-algorithm search over analog circuit topologies, simulated with ngspice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "networkx>=3.3",
]

[project.scripts]
acd = "acd.cli:main"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-networkx>=3.3",
    "matplotlib>=3.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "ngspice: needs the ngspice shared library (skipped when it is not installed)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["acd", "helpers"]
